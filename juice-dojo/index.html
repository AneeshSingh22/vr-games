import * as THREE from 'three';

// ============================================================ utilities
const V3 = THREE.Vector3;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const UP = new V3(0, 1, 0);
const FONT = '"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif';
const _a = new V3(), _b = new V3(), _c = new V3(), _d = new V3(), _e = new V3();
const _col = new THREE.Color();

function makeTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function circle(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function dots(g, w, h, n, colors, rmin, rmax, alpha) {
  for (let i = 0; i < n; i++) {
    g.globalAlpha = alpha * Math.random(); g.fillStyle = pick(colors);
    circle(g, Math.random() * w, Math.random() * h, rand(rmin, rmax));
  }
  g.globalAlpha = 1;
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function distPointSeg(p, a, b) {
  _d.subVectors(b, a); const l2 = _d.lengthSq();
  const t = l2 > 0 ? clamp(_e.subVectors(p, a).dot(_d) / l2, 0, 1) : 0;
  return _e.copy(a).addScaledVector(_d, t).distanceTo(p);
}
let best = 0; try { best = +localStorage.getItem('juiceDojoBest') || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('juiceDojoBest', best); } catch (e) {} }

// ============================================================ renderer / scene

const dropTex = makeTex(64, 64, (g) => {

});

    const i = (y * w + x) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = 255; img.data[i + 3] = a * 255;

});

// ============================================================ sky
const SUN_DIR = new V3(0.28, 0.07, -1).normalize();
const skyUniforms = {
  uTop: { value: new THREE.Color('#171142') }, uMid: { value: new THREE.Color('#7d3b7a') },
  uHorizon: { value: new THREE.Color('#ff9a62') }, uDeep: { value: new THREE.Color('#2a1b3d') },
  uSunDir: { value: SUN_DIR }, uSlow: { value: 0 }, uTime: { value: 0 },
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms, side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform vec3 uTop,uMid,uHorizon,uDeep,uSunDir; uniform float uSlow,uTime; varying vec3 vDir;
    float hash(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    void main(){
      vec3 d=normalize(vDir); float h=d.y; vec3 col;
      if(h>0.0){ col=mix(uHorizon,uMid,smoothstep(0.0,0.22,h)); col=mix(col,uTop,smoothstep(0.22,0.75,h)); }
      else { col=mix(uHorizon,uDeep,smoothstep(0.0,0.25,-h)); }
      float sd=max(dot(d,uSunDir),0.0);
      col+=vec3(1.0,0.78,0.5)*pow(sd,1400.0)*7.0;
      col+=vec3(1.0,0.55,0.3)*pow(sd,40.0)*0.7;
      col+=vec3(1.0,0.45,0.35)*pow(sd,6.0)*0.25;
      vec3 sp=floor(d*420.0); float st=hash(sp);
      float star=step(0.9975,st)*smoothstep(0.25,0.6,h);
      col+=vec3(star)*(0.6+0.4*sin(uTime*2.0+st*100.0));
      col=mix(col, col*vec3(0.5,0.85,1.6)+vec3(0.0,0.03,0.09), uSlow);
      gl_FragColor=vec4(col,1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 24), skyMat);
sky.renderOrder = -1; scene.add(sky);

// environment map from the sky, for reflections on blades, water, fruit
{

// distant mountains (three hazy layers)
function mountainLayer(radius, hMin, hMax, top, bottom, seed) {
  const segs = 200, pos = [], col = [], idx = [];
  const cT = new THREE.Color(top), cB = new THREE.Color(bottom);
  const sunAz = Math.atan2(SUN_DIR.x, -SUN_DIR.z);
  for (let i = 0; i <= segs; i++) {
    const a = i / segs * Math.PI * 2;
    let n = 0.5 + 0.25 * Math.sin(a * 3 + seed) + 0.15 * Math.sin(a * 7.3 + seed * 2) + 0.08 * Math.sin(a * 17 + seed * 3) + 0.04 * Math.sin(a * 41 + seed);
    n = Math.pow(clamp(n, 0, 1), 1.4);
    let da = Math.abs(((a - sunAz + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
    const valley = 0.3 + 0.7 * THREE.MathUtils.smoothstep(da, 0.05, 0.6);
    const h = (hMin + (hMax - hMin) * n) * valley;
    const x = Math.sin(a) * radius, z = -Math.cos(a) * radius;
    pos.push(x, -3, z, x, -3 + h, z);
    col.push(cB.r, cB.g, cB.b, cT.r, cT.g, cT.b);
    if (i < segs) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setIndex(idx);
  return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, fog: false }));
}
scene.add(mountainLayer(430, 30, 95, '#c2687e', '#f39a7c', 1.3));
scene.add(mountainLayer(310, 22, 62, '#7b3e6c', '#d07a7c', 4.1));
scene.add(mountainLayer(210, 12, 38, '#3a2146', '#8c4f68', 2.2));

// clouds
const cloudTex = makeTex(512, 128, (g) => {

});

}

// torii gate standing in the water, framing the sun
function makeTorii() {

  const red = new THREE.MeshStandardMaterial({ color: '#c8361f', roughness: 0.55, emissive: '#3a0a04' });

    const tip = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 0.9), black); tip.position.set(sx * 5.7, 9.3, 0); tip.rotation.z = sx * 0.2; g.add(tip);
  }
  const kasagi = new THREE.Mesh(new THREE.BoxGeometry(10.4, 0.55, 0.9), black); kasagi.position.y = 9.15; g.add(kasagi);
  const shimaki = new THREE.Mesh(new THREE.BoxGeometry(10, 0.45, 0.75), red); shimaki.position.y = 8.65; g.add(shimaki);
  const nuki = new THREE.Mesh(new THREE.BoxGeometry(9.2, 0.42, 0.45), red); nuki.position.y = 7.0; g.add(nuki);
  const gaku = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), red); gaku.position.y = 7.8; g.add(gaku);
  return g;
}

// cherry blossom trees on rocks
const rockMat = new THREE.MeshStandardMaterial({ color: '#3b3346', roughness: 0.95, flatShading: true });
const barkMat = new THREE.MeshStandardMaterial({ color: '#3a2420', roughness: 0.9 });
const blossomMat = new THREE.MeshStandardMaterial({ roughness: 0.9, flatShading: true, emissive: '#5a1030', emissiveIntensity: 0.35 });
function cherryTree(x, z, s, seed) {
  const root = new THREE.Group(); root.position.set(x, -3, z); root.scale.setScalar(s); root.rotation.y = seed;
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1.6, 0), rockMat); rock.scale.set(1.3, 0.6, 1.1); rock.position.y = 0.1; root.add(rock);
  const trunkPath = new THREE.CatmullRomCurve3([new V3(0, 0, 0), new V3(0.25, 1.5, 0.1), new V3(-0.1, 3, 0.2), new V3(0.3, 4.1, 0)]);
  root.add(new THREE.Mesh(new THREE.TubeGeometry(trunkPath, 12, 0.22, 7), barkMat));
  const tips = [];
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * Math.PI * 2 + seed, start = trunkPath.getPoint(rand(0.6, 0.9));
    const tip = new V3(start.x + Math.cos(a) * rand(1.2, 2), start.y + rand(0.6, 1.6), start.z + Math.sin(a) * rand(1.2, 2));
    const mid = start.clone().lerp(tip, 0.5).add(new V3(0, 0.3, 0));
    root.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([start, mid, tip]), 8, 0.08, 5), barkMat));
    tips.push(tip);
  }
  tips.push(new V3(0.3, 4.6, 0));
  const count = 220, inst = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), blossomMat, count);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), pal = ['#ffb7d0', '#ff9cc2', '#ffd1e3', '#f78fb3', '#ffc4dc'];
  for (let i = 0; i < count; i++) {
    const p = pick(tips).clone().add(_a.randomDirection().multiplyScalar(rand(0.1, 1.3)));
    q.setFromEuler(new THREE.Euler(rand(0, 6), rand(0, 6), rand(0, 6)));
    m.compose(p, q, new V3().setScalar(rand(0.22, 0.48)));
    inst.setMatrixAt(i, m); inst.setColorAt(i, _col.set(pick(pal)));
  }
  root.add(inst); scene.add(root);
}
cherryTree(-8.5, -9, 1.15, 0.4);

});

    for (const dy of [-0.22, 0.22]) {

function fleshTexture(f) {

    const c = 128; g.fillStyle = f.rind; g.fillRect(0, 0, 256, 256);
    let r = 128 * (1 - f.rindW);
    if (f.pith) { g.fillStyle = f.pith; circle(g, c, c, r); r *= 1 - f.pithW; }
    const gr = g.createRadialGradient(c, c, 0, c, c, r); gr.addColorStop(0, f.center); gr.addColorStop(1, f.inner);
    g.fillStyle = gr; circle(g, c, c, r);
    g.save(); g.beginPath(); g.arc(c, c, r, 0, 7); g.clip();
    dots(g, 256, 256, 260, ['#ffffff'], 0.8, 2.4, 0.22);
    g.restore();
    SEEDS[f.seeds] && SEEDS[f.seeds](g, c, r);
  });
}

class Particles {
  constructor(n, { size, map, additive = false, onFloor = null }) {
    Object.assign(this, { n, i: 0, additive, onFloor });
    this.p = new Float32Array(n * 3).fill(-999); this.c = new Float32Array(n * 3); this.base = new Float32Array(n * 3);
    this.v = new Float32Array(n * 3); this.life = new Float32Array(n); this.max = new Float32Array(n).fill(1);
    this.g = new Float32Array(n); this.drag = new Float32Array(n);
    const geo = new THREE.BufferGeometry();
    this.pa = new THREE.BufferAttribute(this.p, 3).setUsage(THREE.DynamicDrawUsage);
    this.ca = new THREE.BufferAttribute(this.c, 3).setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('position', this.pa); geo.setAttribute('color', this.ca);
    this.points = new THREE.Points(geo, new THREE.PointsMaterial({ size, map, vertexColors: true, transparent: true, depthWrite: false,
      blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, toneMapped: !additive, alphaTest: additive ? 0 : 0.08 }));
    this.points.frustumCulled = false; scene.add(this.points);
  }
  emit(x, y, z, vx, vy, vz, col, life, grav = 9, drag = 0.5) {
    const i = this.i; this.i = (i + 1) % this.n; const j = i * 3;
    this.p[j] = x; this.p[j + 1] = y; this.p[j + 2] = z; this.v[j] = vx; this.v[j + 1] = vy; this.v[j + 2] = vz;
    this.base[j] = this.c[j] = col.r; this.base[j + 1] = this.c[j + 1] = col.g; this.base[j + 2] = this.c[j + 2] = col.b;
    this.life[i] = this.max[i] = life; this.g[i] = grav; this.drag[i] = drag;
  }
  update(dt) {
    const { p, v, c, base, life, max } = this; let any = false;
    for (let i = 0; i < this.n; i++) {
      if (life[i] <= 0) continue; any = true; life[i] -= dt; const j = i * 3;
      if (life[i] <= 0) { p[j + 1] = -999; continue; }
      const d = 1 - this.drag[i] * dt;
      v[j] *= d; v[j + 1] = v[j + 1] * d - this.g[i] * dt; v[j + 2] *= d;
      p[j] += v[j] * dt; p[j + 1] += v[j + 1] * dt; p[j + 2] += v[j + 2] * dt;
      if (this.additive) { const k = life[i] / max[i]; c[j] = base[j] * k; c[j + 1] = base[j + 1] * k; c[j + 2] = base[j + 2] * k; }

function makePanel(w, h, worldW) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(worldW, worldW * h / w), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false }));
  m.renderOrder = 5; scene.add(m);
  return { mesh: m, g: c.getContext('2d'), w, h, tex };
}
function panelBg(g, w, h) {
  g.clearRect(0, 0, w, h); roundRect(g, 10, 10, w - 20, h - 20, 44);
  g.fillStyle = 'rgba(14,8,28,0.66)'; g.fill();
  const gr = g.createLinearGradient(0, 0, w, 0); gr.addColorStop(0, '#ffb347'); gr.addColorStop(0.5, '#ff4fa0'); gr.addColorStop(1, '#29e3ff');
  g.lineWidth = 6; g.strokeStyle = gr; g.shadowColor = '#ff4fa0'; g.shadowBlur = 22; g.stroke(); g.shadowBlur = 0;
}
function glowText(g, text, x, y, font, fill, glowCol, blur = 30) {
  g.font = font; g.shadowColor = glowCol; g.shadowBlur = blur; g.fillStyle = fill; g.fillText(text, x, y); g.shadowBlur = 0;
}
const board = makePanel(1024, 640, 1.5);
const hud = makePanel(1024, 300, 1.25);

function drawTitle() {
  const { g, w, h } = board; panelBg(g, w, h); g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  const gr = g.createLinearGradient(200, 0, 824, 0); gr.addColorStop(0, '#ffc15a'); gr.addColorStop(0.5, '#ff5f9e'); gr.addColorStop(1, '#5fe8ff');
  glowText(g, 'JUICE DOJO', w / 2, 200, `900 150px ${FONT}`, gr, '#ff4fa0', 40);
  glowText(g, 'SLICE THE WATERMELON TO BEGIN', w / 2, 300, `800 46px ${FONT}`, '#ffffff', '#29e3ff', 18);
  g.fillStyle = 'rgba(255,255,255,.78)'; g.font = `600 33px ${FONT}`;
  g.fillText('Swing fast to slice  •  3+ in one swing = COMBO', w / 2, 392);
  g.fillText('Never hit a bomb  •  Golden star = SLOW-MO', w / 2, 442);
  g.fillText('Let 3 fruit fall and it’s over', w / 2, 492);
  glowText(g, `BEST  ${best}`, w / 2, 578, `900 50px ${FONT}`, '#ffd166', '#ff9a3a', 18);
  board.tex.needsUpdate = true;
}
function drawGameOver(reason, isNewBest) {
  const { g, w, h } = board; panelBg(g, w, h); g.textAlign = 'center';
  const gr = g.createLinearGradient(250, 0, 774, 0); gr.addColorStop(0, '#ff5a3c'); gr.addColorStop(1, '#ffb347');
  glowText(g, reason === 'bomb' ? 'BOOM!' : 'GAME OVER', w / 2, 170, `900 130px ${FONT}`, gr, '#ff3a2a', 40);
  g.fillStyle = 'rgba(255,255,255,.7)'; g.font = `700 40px ${FONT}`; g.fillText('SCORE', w / 2, 250);
  glowText(g, String(score), w / 2, 410, `900 170px ${FONT}`, '#ffffff', '#ff4fa0', 30);
  if (isNewBest) glowText(g, 'NEW BEST!', w / 2, 490, `900 56px ${FONT}`, '#ffd166', '#ff9a3a', 24);
  else { g.fillStyle = '#ffd166'; g.font = `800 44px ${FONT}`; g.fillText(`BEST  ${best}`, w / 2, 485); }
  g.fillStyle = 'rgba(255,255,255,.85)'; g.font = `700 38px ${FONT}`; g.fillText('Slice the fruit to play again', w / 2, 575);
  board.tex.needsUpdate = true;
}
function drawHud() {
  const { g, w, h } = hud; panelBg(g, w, h);
  g.textAlign = 'left'; g.fillStyle = 'rgba(255,255,255,.65)'; g.font = `800 34px ${FONT}`; g.fillText('SCORE', 70, 92);
  glowText(g, String(score), 66, 230, `900 136px ${FONT}`, '#ffffff', '#ff4fa0', 26);
  if (realTime < slowUntil) { g.textAlign = 'center'; glowText(g, 'SLOW-MO', 520, 165, `900 52px ${FONT}`, '#7ff3ff', '#29e3ff', 26); }
  for (let i = 0; i < 3; i++) {
    const x = 700 + i * 100, y = 130, s = 32, lost = i < 3 - lives;
    g.lineCap = 'round'; g.lineWidth = 16;
    g.strokeStyle = lost ? '#ff3346' : 'rgba(255,255,255,.28)';
    if (lost) { g.shadowColor = '#ff3346'; g.shadowBlur = 20; }
    g.beginPath(); g.moveTo(x - s, y - s); g.lineTo(x + s, y + s); g.moveTo(x + s, y - s); g.lineTo(x - s, y + s); g.stroke(); g.shadowBlur = 0;
  }
  g.textAlign = 'right'; g.fillStyle = '#ffd166'; g.font = `800 36px ${FONT}`; g.fillText(`BEST  ${best}`, 960, 250);
  hud.tex.needsUpdate = true;
}

// ============================================================ game state
const G = 7.2;
let state = 'menu', score = 0, lives = 3, gameTime = 0, spawnTimer = 0, spawnQueue = [];
let realTime = 0, timeScale = 1, slowUntil = -10, freezeUntil = -10, overTime = 0, pendingStart = -1, hudDirty = true, wasSlow = false;
let eyeY = 1.6, calibrateAt = -1, menuFruit = null, nextNote = 0;
let fruits = [];
const pieces = [];

function layout() {
  board.mesh.position.set(0, eyeY + 0.5, -2.25); board.mesh.rotation.x = 0.1;
  hud.mesh.position.set(0, eyeY + 0.7, -2.15); hud.mesh.rotation.x = 0.14;
  if (menuFruit) menuFruit.base.set(0, eyeY - 0.3, -0.8);
}

function spawnMenuFruit() {
  const f = makeFruit('watermelon'); f.isMenu = true; f.base = new V3(0, eyeY - 0.3, -0.8);
  f.group.position.copy(f.base); f.group.rotation.set(0.3, 0, 0.2); scene.add(f.group);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.212, 64), new THREE.MeshBasicMaterial({ color: '#ffd166', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }));
  scene.add(ring); f.extras.push(ring);
  const label = makeTextSprite('SLICE ME', '#ffffff', 0.06); scene.add(label); f.extras.push(label);
  fruits.push(f); menuFruit = f;
}
function removeFruit(f) {
  f.alive = false; scene.remove(f.group);
  for (const e of f.extras) { scene.remove(e); if (e.material) { if (e.material.map && e.isSprite) e.material.map.dispose(); e.material.dispose(); } }
  if (f === menuFruit) menuFruit = null;
}

function startGame() {
  state = 'playing'; score = 0; lives = 3; gameTime = 0; spawnTimer = 1.0; spawnQueue = []; slowUntil = -10;
  board.mesh.visible = false; hud.mesh.visible = true; hudDirty = true;
}
function gameOver(reason) {
  state = 'over'; overTime = realTime; spawnQueue = [];
  const isNewBest = score > best; if (isNewBest) { best = score; saveBest(); }
  drawGameOver(reason, isNewBest); board.mesh.visible = true; hud.mesh.visible = false;
}

function launch(kind, opts = {}) {
  const f = makeFruit(kind);
  const y0 = -1.6, x0 = opts.x0 ?? rand(-0.9, 0.9), z0 = rand(-1.6, -1.3);
  const xa = opts.xa ?? clamp(x0 * 0.35 + rand(-0.4, 0.4), -0.65, 0.65);
  const ya = rand(eyeY - 0.5, eyeY + 0.25), za = rand(-1.05, -0.78);
  const vy = Math.sqrt(2 * G * (ya - y0)), t = vy / G;
  f.vel.set((xa - x0) / t, vy, (za - z0) / t);
  f.group.position.set(x0, y0, z0); scene.add(f.group); fruits.push(f);
  const pan = clamp(x0 / 1.2, -1, 1);
  Audio.launch(pan); if (f.isBomb) Audio.fuse(pan);
}

function scheduleWave() {
  const e = gameTime;
  const maxN = Math.min(6, 1 + Math.floor(e / 12));
  const n = 1 + Math.floor(Math.random() * maxN);
  const pattern = n >= 3 ? pick(['burst', 'stream', 'fan']) : 'burst';
  const bombChance = e < 10 ? 0 : Math.min(0.3, 0.1 + e * 0.002);
  let bombs = 0, star = false;
  for (let i = 0; i < n; i++) {
    let kind = randomKind();
    if (Math.random() < bombChance && bombs < (e > 60 ? 2 : 1)) { kind = 'bomb'; bombs++; }
    else if (!star && e > 18 && realTime > slowUntil + 6 && Math.random() < 0.06) { kind = 'star'; star = true; }
    const delay = pattern === 'stream' ? i * 0.22 : pattern === 'fan' ? i * 0.12 : Math.random() * 0.08;
    const opts = {};
    if (pattern === 'fan') { const side = i % 2 ? -1 : 1; opts.x0 = side * rand(1.1, 1.4); opts.xa = -side * rand(0.05, 0.5); }
    spawnQueue.push({ t: gameTime + delay, kind, opts });
  }
  return Math.max(0.8, 2.1 - e * 0.018) + (n > 3 ? 0.4 : 0);
}

// ---- slicing
function trySlice(h) {
  const bladeDir = _a.subVectors(h.curB, h.curA).normalize();
  const n = new V3().crossVectors(bladeDir, h.motion);
  if (n.lengthSq() < 1e-12) n.randomDirection(); n.normalize();
  const mdir = h.motion.clone().normalize();
  const sa = new V3(), sb = new V3();
  for (const f of fruits) {
    if (!f.alive) continue;
    const r = f.radius * (f.isBomb ? 0.95 : 1.18);
    for (let s = 0; s <= 4; s++) {
      const k = s / 4; sa.lerpVectors(h.prevA, h.curA, k); sb.lerpVectors(h.prevB, h.curB, k);
      if (distPointSeg(f.group.position, sa, sb) < r) { sliceFruit(f, h, n, mdir); break; }
    }
  }
  fruits = fruits.filter((f) => f.alive);
}

function sliceFruit(f, h, n, mdir) {
  const p = f.group.position.clone(), pan = clamp(p.x / 1.2, -1, 1);
  removeFruit(f);
  if (f.isBomb) { explode(p, pan); if (state === 'playing') gameOver('bomb'); return; }
  if (f.isStar) {
    starBurst(p); Audio.star(); buzz(h, 0.8, 120);
    if (state === 'playing') { slowUntil = realTime + 5; score += 5; hudDirty = true; floatText('SLOW-MO!  +5', _a.copy(p).add(new V3(0, 0.15, 0.1)), '#7ff3ff', 0.1, 1.5); }
    return;
  }
  buzz(h, 0.6, 40);
  createHalves(f, p, n, mdir);
  juiceBurst(p, f.def.juiceColor, mdir, f.radius, f.vel);
  slashStreak(p, n, mdir, h.color);
  Audio.slice(pan);
  if (f.isMenu) { pendingStart = realTime + 0.7; board.mesh.visible = false; return; }
  if (state !== 'playing') return;
  let pts = 1;
  if (Math.random() < 0.06) { pts = 10; Audio.critical(); flash(p, '#ffffff', 0.7, 0.3); floatText('CRITICAL! +10', _a.copy(p).add(new V3(0, 0.12, 0.1)), '#ffe066', 0.09, 1.2); buzz(h, 1, 90); }
  else floatText('+1', _a.copy(p).add(new V3(0, 0.08, 0.1)), '#ffffff', 0.06, 0.8);
  score += pts; hudDirty = true;
  h.combo = realTime - h.lastSlice < 0.35 ? h.combo + 1 : 1;
  h.lastSlice = realTime; h.lastPos.copy(p);
}

function createHalves(f, p, n, mdir) {
  const def = f.def, sv = new V3(def.r * def.s[0], def.r * def.s[1], def.r * def.s[2]);
  const nl = n.clone().applyQuaternion(f.group.quaternion.clone().invert()).multiply(sv).normalize();
  for (const sign of [1, -1]) {
    const pg = new THREE.Group(); pg.position.copy(p).addScaledVector(n, sign * 0.008); pg.quaternion.copy(f.group.quaternion);
    const sg = new THREE.Group(); sg.scale.copy(sv); pg.add(sg);
    const og = new THREE.Group(); og.quaternion.setFromUnitVectors(UP, nl.clone().multiplyScalar(sign)); sg.add(og);
    og.add(new THREE.Mesh(hemiGeo, def.skinMat)); og.add(new THREE.Mesh(capGeo, def.fleshMat));
    scene.add(pg);
    pieces.push({ group: pg, life: 0,
      vel: f.vel.clone().multiplyScalar(0.55).addScaledVector(n, sign * rand(0.9, 1.4)).addScaledVector(mdir, 0.9),
      ang: new V3(rand(-7, 7), rand(-7, 7), rand(-7, 7)) });
  }
}

function juiceBurst(p, color, mdir, r, fv) {
  const count = Math.round(40 + r * 420);
  for (let i = 0; i < count; i++) {
    const d = _b.randomDirection(), sp = rand(0.4, 2.6), m = rand(0.3, 2.0);
    _col.copy(color).multiplyScalar(rand(0.75, 1.15));
    juice.emit(p.x + d.x * r * 0.5, p.y + d.y * r * 0.5, p.z + d.z * r * 0.5,
      d.x * sp + mdir.x * m + fv.x * 0.3, d.y * sp + mdir.y * m + fv.y * 0.3 + 0.8, d.z * sp + mdir.z * m + fv.z * 0.3,
      _col, rand(0.6, 1.5), 9, 0.6);
  }
  for (let i = 0; i < 10; i++) {
    const d = _b.randomDirection();
    _col.copy(color).multiplyScalar(0.45);
    glow.emit(p.x, p.y, p.z, d.x * 0.5, d.y * 0.5, d.z * 0.5, _col, rand(0.25, 0.45), 0, 3);
  }
}
function starBurst(p) {
  flash(p, '#ffd84a', 1.4, 0.5); shockwave(p, '#ffd84a');
  for (let i = 0; i < 160; i++) {
    const d = _b.randomDirection(), sp = rand(0.5, 3.5);
    _col.set(pick(['#ffe066', '#fff2b0', '#ffb703', '#ffffff']));
    glow.emit(p.x, p.y, p.z, d.x * sp, d.y * sp, d.z * sp, _col, rand(0.5, 1.3), 1.5, 1.4);
  }
  juiceBurst(p, FRUITS.star.juiceColor, new V3(0, 1, 0), 0.08, new V3());
}
function explode(p, pan) {
  Audio.boom(pan); buzzAll(1, 400); freezeUntil = realTime + 0.7;
  flash(p, '#fff1c8', 3.2, 0.5); flash(p, '#ff7a1a', 5, 0.9); shockwave(p, '#ffb060');
  for (let i = 0; i < 280; i++) {
    const d = _b.randomDirection(), sp = rand(1, 6.5);
    _col.set(pick(['#ffb347', '#ff7a1a', '#ffe28a', '#ffffff', '#ff4a1a']));
    glow.emit(p.x, p.y, p.z, d.x * sp, d.y * sp, d.z * sp, _col, rand(0.4, 1.3), 2, 1.3);
  }
}

function miss(pos) {
  lives--; hudDirty = true; Audio.miss(); buzzAll(0.3, 60);
  floatText('✕', new V3(clamp(pos.x, -1, 1), 0.35, -0.6), '#ff3346', 0.16, 1.1);
  if (lives <= 0) gameOver('miss');
}

// ============================================================ update loops
function updateFruits(gdt) {
  const t = realTime;
  for (const f of fruits) {
    if (!f.alive) continue;
    const g = f.group;
    if (f.isMenu) {
      g.position.copy(f.base); g.position.y += Math.sin(t * 2) * 0.03; g.rotation.y += gdt * 0.8;
      const [ring, label] = f.extras;
      ring.position.copy(g.position); ring.lookAt(viewerPos()); ring.scale.setScalar(1 + Math.sin(t * 4) * 0.06);
      ring.material.opacity = 0.6 + 0.4 * Math.sin(t * 4);
      label.position.copy(g.position).add(_a.set(0, 0.25, 0));
      continue;
    }
    f.vel.y -= G * gdt; g.position.addScaledVector(f.vel, gdt);
    g.rotation.x += f.ang.x * gdt; g.rotation.y += f.ang.y * gdt; g.rotation.z += f.ang.z * gdt;
    if (f.isBomb) {
      const k = (Math.sin(t * 14) + 1) / 2;
      bombBodyMat.emissive.setRGB(0.55 * k, 0.02 * k, 0);
      f.spark.scale.setScalar(0.06 + Math.random() * 0.06);
      if (Math.random() < 0.8) {
        f.spark.getWorldPosition(_a); _col.set(Math.random() < 0.5 ? '#ffb040' : '#fff0a0');
        glow.emit(_a.x, _a.y, _a.z, rand(-0.4, 0.4), rand(0.2, 0.8), rand(-0.4, 0.4), _col, rand(0.15, 0.35), 2, 1);
      }
    }
    if (f.isStar) {
      f.halo.material.opacity = 0.6 + 0.3 * Math.sin(t * 8);
      if (Math.random() < 0.5) { _col.set('#ffe066'); glow.emit(g.position.x + rand(-0.06, 0.06), g.position.y + rand(-0.06, 0.06), g.position.z + rand(-0.06, 0.06), 0, 0.1, 0, _col, 0.4, -0.2, 1); }
    }
    if (g.position.y < -1.7 && f.vel.y < 0) {
      removeFruit(f);
      if (state === 'playing' && !f.isBomb && !f.isStar) miss(g.position);
    }
  }
  fruits = fruits.filter((f) => f.alive);
}
function updatePieces(gdt) {
  for (let i = pieces.length - 1; i >= 0; i--) {
    const pc = pieces[i]; pc.life += gdt; pc.vel.y -= G * gdt;
    pc.group.position.addScaledVector(pc.vel, gdt);
    pc.group.rotation.x += pc.ang.x * gdt; pc.group.rotation.y += pc.ang.y * gdt; pc.group.rotation.z += pc.ang.z * gdt;
    if (pc.group.position.y < -4 || pc.life > 5) { scene.remove(pc.group); pieces.splice(i, 1); }
  }
}
function updateGame(gdt) {
  if (pendingStart > 0 && realTime >= pendingStart) { pendingStart = -1; startGame(); }
  if (state === 'playing') {
    gameTime += gdt; spawnTimer -= gdt;
    if (spawnTimer <= 0) spawnTimer = scheduleWave();
    for (let i = spawnQueue.length - 1; i >= 0; i--) if (spawnQueue[i].t <= gameTime) { const q = spawnQueue[i]; spawnQueue.splice(i, 1); launch(q.kind, q.opts); }
    for (const h of hands) {
      if (h.combo > 0 && realTime - h.lastSlice > 0.35) {
        if (h.combo >= 3) {
          score += h.combo; hudDirty = true; Audio.combo(h.combo); buzz(h, 0.9, 90);
          floatText(`${h.combo} FRUIT COMBO  +${h.combo}`, _a.copy(h.lastPos).add(new V3(0, 0.2, 0.1)), '#ffb347', 0.09, 1.5);
        }
        h.combo = 0;
      }
    }
  }
  if (state === 'menu' && !menuFruit && pendingStart < 0) spawnMenuFruit();
  if (state === 'over' && !menuFruit && pendingStart < 0 && realTime > overTime + 1.6) spawnMenuFruit();
  const slow = realTime < slowUntil;
  if (slow !== wasSlow) { wasSlow = slow; hudDirty = true; }
  if (hudDirty && hud.mesh.visible) { drawHud(); hudDirty = false; }
}
function updateAmbient(dt, gdt) {
  for (let i = 0; i < PET_N; i++) {
    const j = i * 3; petalPhase[i] += dt;
    petalPos[j] += (Math.sin(petalPhase[i] * 0.9) * 0.25 + 0.12) * gdt;
    petalPos[j + 1] -= 0.22 * gdt;
    petalPos[j + 2] += Math.cos(petalPhase[i] * 0.7) * 0.15 * gdt;
    if (petalPos[j + 1] < -1) { petalPos[j] = rand(-6, 6); petalPos[j + 1] = rand(4, 6); petalPos[j + 2] = rand(-7, 3.5); }
  }
  petalGeo.attributes.position.needsUpdate = true;
  for (let i = 0; i < SKY_N; i++) {
    const j = i * 3; skyLanternPos[j + 1] += skyLanternSpd[i] * gdt;
    skyLanternPos[j] += Math.sin(realTime * 0.3 + i) * 0.05 * gdt;
    if (skyLanternPos[j + 1] > 80) skyLanternPos[j + 1] = -2;
  }
  skyLanternGeo.attributes.position.needsUpdate = true;
  for (const l of lanternLights) l.intensity = 6 * (0.9 + 0.08 * Math.sin(realTime * 13 + l.position.x) + 0.04 * Math.random());
  for (const s of splats) if (s.life > 0) { s.life -= dt; s.m.material.opacity = Math.min(0.85, s.life / 3 * 0.85); if (s.life <= 0) s.m.visible = false; }
  if (Audio.ctx && realTime > nextNote) {
    Audio.pluck(pick(SCALE) * (realTime < slowUntil ? 0.75 : 1));
    nextNote = realTime + pick([0.45, 0.6, 0.9, 1.2, 1.8]);
  }
}

// ============================================================ XR session hooks
function particleSizes(vr) { juice.points.material.size = vr ? 0.017 : 0.032; glow.points.material.size = vr ? 0.05 : 0.09; }
particleSizes(false);
renderer.xr.addEventListener('sessionstart', () => {
  particleSizes(true);
  Audio.init(); calibrateAt = realTime + 0.6;
  const info = document.getElementById('info'); if (info) info.style.display = 'none';
});
renderer.xr.addEventListener('sessionend', () => {
  particleSizes(false);
  eyeY = 1.6; layout(); renderer.setSize(innerWidth, innerHeight); desktopCamera();
  const info = document.getElementById('info'); if (info) info.style.display = '';
});

// ============================================================ main loop
drawTitle(); hud.mesh.visible = false; layout();
let lastT = performance.now() / 1000;
renderer.setAnimationLoop((tms) => {
  const now = tms / 1000; const dt = clamp(now - lastT, 0, 0.05); lastT = now; realTime += dt;

  if (renderer.xr.isPresenting && calibrateAt > 0 && realTime > calibrateAt) {
    calibrateAt = -1; const y = renderer.xr.getCamera().getWorldPosition(_a).y;
    if (y > 0.5) { eyeY = clamp(y, 1.1, 2.0); layout(); }
  }

  let target = realTime < slowUntil ? 0.35 : 1; if (realTime < freezeUntil) target = 0.12;
  timeScale += (target - timeScale) * Math.min(1, dt * 8);
  const gdt = dt * timeScale;
  skyUniforms.uSlow.value += ((realTime < slowUntil ? 1 : 0) - skyUniforms.uSlow.value) * Math.min(1, dt * 4);
  skyUniforms.uTime.value = realTime;

  for (const h of hands) {
    h.update(dt);
    if (h.valid && h.prevValid) {
      if (h.speed > h.threshold) trySlice(h);
      if (h.speed > h.threshold * 2.2 && realTime > h.swooshAt) { Audio.swoosh(clamp(h.curB.x, -1, 1), clamp(h.speed / 8, 0.3, 1)); h.swooshAt = realTime + 0.28; }
    }
    h.updateTrail(); h.commit();
  }

  updateGame(gdt);
  updateFruits(gdt);
  updatePieces(gdt);
  juice.update(gdt); glow.update(gdt);
  updateFx(dt);
  updateAmbient(dt, gdt);
  renderer.render(scene, camera);
});
</script>
